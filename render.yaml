# Render Blueprint: база PostgreSQL, API (NestJS), сайт (React) і довідка (Docusaurus) з одного репозиторію.
# Секрети (AI_API_KEY) вводяться в панелі Render під час створення Blueprint.
# Якщо Render дасть сервісам інші адреси, ніж tasko-ai-api / tasko-ai-web,
# виправте WEB_ORIGIN і VITE_API_URL нижче (або в панелі) та передеплойте.

databases:
  - name: tasko-ai-db
    plan: free
    databaseName: tasko
    user: tasko

services:
  - type: web
    name: tasko-ai-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    # Міграції ідемпотентні: на вже оновленій базі нічого не змінюють
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Перед API один проксі Render: реальний IP користувача для лімітів спроб і списку сеансів
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: tasko-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://taskoai.pp.ua
      - key: AI_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false
      # OAuth Client ID з Google Cloud Console (той самий, що й VITE_GOOGLE_CLIENT_ID)
      - key: GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: tasko-ai-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://tasko-ai-api-w83l.onrender.com
      # Сайт довідки (сервіс tasko-ai-docs нижче); кнопка «?» і пункт «Довідка» ведуть туди
      - key: VITE_DOCS_URL
        value: https://tasko-ai-docs.onrender.com
      # Без нього кнопка «Увійти через Google» не показується
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
    # Усі адреси сайту віддають index.html — маршрутизацію робить React Router
    routes:
      # Політика конфіденційності — окремий статичний HTML (public/privacy), не React
      - type: rewrite
        source: /privacy
        destination: /privacy/index.html
      - type: rewrite
        source: /privacy/
        destination: /privacy/index.html
      - type: rewrite
        source: /*
        destination: /index.html

  # Довідка на Docusaurus: окремий статичний сайт, українська в корені, англійська в /en/
  - type: web
    name: tasko-ai-docs
    runtime: static
    rootDir: apps/docs
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: APP_URL
        value: https://taskoai.pp.ua
      - key: DOCS_URL
        value: https://tasko-ai-docs.onrender.com
