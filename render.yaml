# Render Blueprint: база PostgreSQL, API (NestJS) і сайт (React) з одного репозиторію.
# Секрети (AI_API_KEY) вводяться в панелі Render під час створення Blueprint.
# Якщо Render дасть сервісам інші адреси, ніж tasko-ai-api / tasko-ai-web,
# виправте WEB_ORIGIN і VITE_API_URL нижче (або в панелі) та передеплойте.

databases:
  - name: tasko-ai-db
    plan: free
    databaseName: tasko
    user: tasko

services:
  - type: web
    name: tasko-ai-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm ci && npm run build
    # Міграції ідемпотентні: на вже оновленій базі нічого не змінюють
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: tasko-ai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        value: https://taskoai.pp.ua
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_API_KEY
        sync: false

  - type: web
    name: tasko-ai-web
    runtime: static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        value: https://tasko-ai-api.onrender.com
    # Усі адреси сайту віддають index.html — маршрутизацію робить React Router
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
